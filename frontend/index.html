<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Conversor de Audio OPUS a WAV</title>
</head>
<body>
  <h1>Subir archivo .opus</h1>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="audio" accept=".opus" required>
    <button type="submit">Convertir</button>
  </form>
  <p id="status"></p>
  <script>
    const form = document.getElementById('uploadForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Subiendo y convirtiendo...';

      const formData = new FormData(form);
      const response = await fetch('http://localhost:3000/upload', {
        method: 'POST',
        body: formData
      });

      if (response.ok) {
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'convertido.wav';
        a.click();
        status.textContent = '­Conversi¢n completada!';
      } else {
        status.textContent = 'Error al convertir el archivo.';
      }
    });
  </script>
</body>
</html>
