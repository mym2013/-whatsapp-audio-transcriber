<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Audio OPUS a WAV</title>
</head>
<body>
  <h1>Subir archivo .opus</h1>

  <form id="uploadForm">
    <input type="file" name="audio" accept=".opus" required />
    <button type="submit">Convertir</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById('uploadForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      status.textContent = 'Subiendo y convirtiendo...';

      try {
        const response = await fetch('http://localhost:4000/upload', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Error en el servidor');

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'archivo_convertido.wav';
        document.body.appendChild(a);
        a.click();
        a.remove();

        status.textContent = 'Conversión completada.';
      } catch (error) {
        console.error('Error:', error);
        status.textContent = 'Hubo un error durante la conversión.';
      }
    });
  </script>
</body>
</html>
